<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>RoHub has moved</title>
<link rel="canonical" href="https://rohub-app.github.io/">
<noscript><meta http-equiv="refresh" content="0; url=https://rohub-app.github.io/"></noscript>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #000; color: #f5f5f7;
         font: 16px/1.45 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; text-align: center; }
  main { padding: 24px 16px; max-width: 340px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p { color: #a1a1aa; margin: 0 0 22px; }
  b { color: #f5f5f7; }
  .btn { display: inline-block; border: 0; background: #fff; color: #000; font: inherit; font-weight: 700; text-decoration: none;
         padding: 12px 22px; border-radius: 999px; cursor: pointer; }
  .ghost { background: #1c1c1f; color: #f5f5f7; margin-top: 10px; }
  .small { font-size: 13px; margin: 16px 0 0; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>RoHub has moved</h1>
  <p>Its new home is <b>rohub-app.github.io</b></p>
  <a class="btn" id="go" href="https://rohub-app.github.io/">Open RoHub</a>
  <div id="big" hidden>
    <button type="button" class="btn ghost" id="save">Download my RoHub data</button>
    <p class="small">Then open RoHub, go to Settings and tap Restore backup.</p>
  </div>
</main>
<script>
// RoHub's old address. It forwards to the new one and brings this device's ideas, tasks and Roblox link
// along in "#move=", the part of a link that browsers never send to any server.
const NEW = 'https://rohub-app.github.io/';
let target = NEW + (/^#[a-z]+$/.test(location.hash) ? location.hash : '');
let saved = null;
try { saved = JSON.parse(localStorage.getItem('rohub-v1')); } catch {}
if (saved && ((saved.items || []).length || (saved.link && saved.link.username))) {
  const json = JSON.stringify({ app: 'RoHub', version: 1, exportedAt: Date.now(), items: saved.items || [], link: saved.link || null, prefs: saved.prefs || {} });
  let bin = '';
  new TextEncoder().encode(json).forEach(b => { bin += String.fromCharCode(b); });
  const move = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  if (move.length < 60000) target = NEW + '#move=' + move;
  else {
    // Too much to fit in a link: offer it as a backup file instead.
    target = null;
    document.getElementById('big').hidden = false;
    document.getElementById('save').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      a.download = 'rohub-backup.json';
      document.body.appendChild(a); a.click(); a.remove();
    };
  }
}
// Stop the old offline copy from opening the old version.
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
if (target) {
  document.getElementById('go').href = target;
  location.replace(target);
}
</script>
</body>
</html>
